<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leia Mais — Clientes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body onload="verClientes()">

    <nav class="nav">
        <a href="index.html" class="nav-brand">
            <div class="nav-brand-icon">
                <i class="bi bi-journal-bookmark-fill"></i>
            </div>
            <span class="nav-brand-name">Leia Mais</span>
        </a>
        <div class="nav-links">
            <a href="index.html" class="nav-link">
                <i class="bi bi-grid-fill"></i>
                Dashboard
            </a>
            <a href="clientes.html" class="nav-link active">
                <i class="bi bi-people-fill"></i>
                Clientes
            </a>
            <a href="acervo.html" class="nav-link">
                <i class="bi bi-journal-bookmark-fill"></i>
                Acervo
            </a>
            <a href="bibliotecarios.html" class="nav-link">
                <i class="bi bi-person-badge-fill"></i>
                Bibliotecários
            </a>
            <a href="emprestimos.html" class="nav-link">
                <i class="bi bi-arrow-left-right"></i>
                Empréstimos
            </a>
        </div>
        <div class="nav-actions">
            <a href="login.html" class="btn-logout">
                <i class="bi bi-box-arrow-right"></i>
                Sair
            </a>
        </div>
    </nav>

    <main class="page">

        <div class="page-header">
            <h1 class="page-title">Gestão de Clientes</h1>
            <p class="page-subtitle">Cadastre e gerencie alunos e professores do sistema.</p>
        </div>

        <div class="two-col">

            <div class="card">
                <div class="card-header">
                    <span class="card-title">Novo Cliente</span>
                </div>
                <div class="card-body">

                    <div class="type-toggle" id="tipo-toggle" role="group" aria-label="Tipo de cliente">
                        <button type="button" class="type-toggle-btn active" data-tipo="aluno" id="btn-tipo-aluno">Aluno</button>
                        <button type="button" class="type-toggle-btn" data-tipo="professor" id="btn-tipo-professor">Professor</button>
                    </div>

                    <form id="form-cliente" autocomplete="off">

                        <input type="hidden" id="campo-tipo" name="tipo" value="aluno" />

                        <div class="form-group">
                            <label class="form-label" for="cliente-nome">Nome completo <span class="req">*</span></label>
                            <input id="cliente-nome" name="nome" type="text" class="form-control"
                                   placeholder="Ex: Calebe Ximenes" required />
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="cliente-cpf">CPF <span class="req">*</span></label>
                            <input id="cliente-cpf" name="cpf" type="text" class="form-control"
                                   placeholder="Ex: 12345678900" maxlength="11" required />
                        </div>

                        <div class="form-group" id="grupo-matricula">
                            <label class="form-label" for="cliente-matricula">
                                Matrícula <span class="req">*</span>
                            </label>
                            <input id="cliente-matricula" name="matriculaAluno" type="text" class="form-control"
                                   placeholder="Ex: 2024001" />
                        </div>

                        <div class="form-group" id="grupo-area" style="display:none;">
                            <label class="form-label" for="cliente-area">
                                Área de atuação <span class="req">*</span>
                            </label>
                            <input id="cliente-area" name="areaAtuacao" type="text" class="form-control"
                                   placeholder="Ex: Matemática, Biologia" />
                        </div>

                        <button type="submit" class="btn btn-primary" id="btn-cadastrar-cliente" onclick="salvarCliente(event)">
                            <i class="bi bi-person-plus-fill"></i>
                            Cadastrar Aluno
                        </button>

                        <div id="resultado" style="margin-top: 15px; font-weight: bold; text-align: center; font-size: 14px;"></div>

                    </form>

                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <span class="card-title">Clientes Cadastrados</span>
                    <button class="btn-sm btn-sm-blue" onclick="verClientes()">
                        <i class="bi bi-arrow-clockwise"></i> Atualizar
                    </button>
                </div>

                <div class="table-wrap">
                    <table id="tabela-clientes" aria-label="Lista de clientes">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>CPF</th>
                                <th>Tipo</th>
                                <th>Informação Específica</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="tbody-clientes">
                            <tr>
                                <td colspan="5">
                                    <div class="empty-state">
                                        <i class="bi bi-people"></i>
                                        <p>Carregando clientes...</p>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </main>

    <script>
    const toggleBtns = document.querySelectorAll('.type-toggle-btn');
    const campoTipo  = document.getElementById('campo-tipo');
    const grupoMat   = document.getElementById('grupo-matricula');
    const grupoArea  = document.getElementById('grupo-area');
    const btnLabel   = document.getElementById('btn-cadastrar-cliente');

    const labels = {
      aluno:     'Cadastrar Aluno',
      professor: 'Cadastrar Professor'
    };

    function atualizarTipo(tipo) {
      campoTipo.value = tipo;

      if (tipo === 'aluno') {
          grupoMat.style.display  = '';
          grupoArea.style.display = 'none';
      } else {
          grupoMat.style.display  = 'none';
          grupoArea.style.display = '';
      }

      btnLabel.innerHTML = `<i class="bi bi-person-plus-fill"></i> ${labels[tipo]}`;
    }

    toggleBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        toggleBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        atualizarTipo(btn.dataset.tipo);
      });
    });

    async function salvarCliente(event) {
        event.preventDefault();

        const tipo = document.getElementById('campo-tipo').value;
        const nomeCli = document.getElementById('cliente-nome').value;
        const cpfCli = document.getElementById('cliente-cpf').value;
        const divResultado = document.getElementById('resultado');

        let rotaApi = '';
        let dados = {};

        if (tipo === 'aluno') {
            rotaApi = 'http://localhost:5199/api/Cliente/aluno';
            dados = {
                nome: nomeCli,
                cpf: cpfCli,
                matricula: document.getElementById('cliente-matricula').value,
                matriculaAluno: document.getElementById('cliente-matricula').value
            };
        } else if (tipo === 'professor') {
            rotaApi = 'http://localhost:5199/api/Cliente/professor';
            dados = {
                nome: nomeCli,
                cpf: cpfCli,
                areaAtuacao: document.getElementById('cliente-area').value
            };
        }

        divResultado.innerHTML = "⏳ Enviando para a API...";
        divResultado.style.color = "var(--color-text-muted)";

        try {
            const resposta = await fetch(rotaApi, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });

            if (resposta.ok) {
                divResultado.innerHTML = `✅ ${tipo.toUpperCase()} cadastrado com sucesso!`;
                divResultado.style.color = "var(--color-green)";

                document.getElementById('form-cliente').reset();
                verClientes();

                setTimeout(() => divResultado.innerHTML = "", 4000);
            } else {
                const erro = await resposta.text();
                divResultado.innerHTML = "❌ Erro na API: " + erro;
                divResultado.style.color = "var(--color-red)";
            }
        } catch (error) {
            divResultado.innerHTML = "🚨 Erro de conexão com a API.";
            divResultado.style.color = "var(--color-red)";
        }
    }

    async function verClientes() {
        const tbody = document.getElementById('tbody-clientes');

        try {
            const resposta = await fetch('http://localhost:5199/api/Cliente', {
                method: 'GET',
                headers: { 'Content-Type': 'application/json' }
            });

            if (resposta.ok) {
                const clientes = await resposta.json();
                tbody.innerHTML = "";

                if (clientes.length === 0) {
                    tbody.innerHTML = `
                      <tr>
                        <td colspan="5">
                          <div class="empty-state">
                            <i class="bi bi-people"></i>
                            <p>Nenhum cliente cadastrado.</p>
                          </div>
                        </td>
                      </tr>`;
                    return;
                }

                clientes.forEach(cli => {
                    let isAluno = true;

                    if ((cli.tipoCliente && cli.tipoCliente.toLowerCase() === 'professor') || cli.areaAtuacao !== undefined) {
                        isAluno = false;
                    }

                    const infoTexto = isAluno
                        ? `Matrícula: ${cli.matricula || cli.matriculaAluno || 'Não informada'}`
                        : `Área: ${cli.areaAtuacao || 'Não informada'}`;

                    const primeiraLetra = cli.nome ? cli.nome.charAt(0).toUpperCase() : 'C';

                    const corPill = isAluno ? "pill-blue" : "pill-purple";
                    const corAvatar = isAluno ? "background:var(--color-primary-light);color:var(--color-primary);" : "background:var(--color-purple-light);color:var(--color-purple);";

                    const tipoTexto = isAluno ? "Aluno" : "Professor";

                    tbody.innerHTML += `
                        <tr>
                            <td>
                              <div class="avatar-cell">
                                <div class="avatar" style="${corAvatar}">${primeiraLetra}</div>
                                <strong>${cli.nome}</strong>
                              </div>
                            </td>
                            <td class="td-muted">${cli.cpf}</td>
                            <td><span class="pill ${corPill}">${tipoTexto}</span></td>
                            <td class="td-muted">${infoTexto}</td>
                            <td class="td-actions">
                              <button class="btn-icon" title="Remover cliente" onclick="deletarCliente('${cli.cpf}')">
                                <i class="bi bi-trash-fill"></i>
                              </button>
                            </td>
                        </tr>
                    `;
                });
            }
        } catch (error) {
            console.error(error);
            tbody.innerHTML = `<tr><td colspan="5" style="color: var(--color-red); text-align: center;">🚨 Erro ao buscar os dados da API.</td></tr>`;
        }
    }

    async function deletarCliente(cpf) {
        const divResultado = document.getElementById('resultado');
        divResultado.innerHTML = "⏳ Excluindo cliente...";
        divResultado.style.color = "var(--color-text-muted)";

        try {
            const resposta = await fetch(`http://localhost:5199/api/Cliente/${cpf}`, {
                method: 'DELETE'
            });

            if (resposta.ok) {
                divResultado.innerHTML = "✅ Cliente removido com sucesso!";
                divResultado.style.color = "var(--color-green)";
                verClientes();

                setTimeout(() => divResultado.innerHTML = "", 4000);
            } else {
                const erro = await resposta.text();
                divResultado.innerHTML = "❌ Erro ao excluir: " + erro;
                divResultado.style.color = "var(--color-red)";
            }
        } catch (error) {
            divResultado.innerHTML = "🚨 Erro de conexão com a API.";
            divResultado.style.color = "var(--color-red)";
        }
    }
    </script>
</body>
</html>
